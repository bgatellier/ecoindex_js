[settings]
experimental = true
lockfile = true

[tools]
node = "22"
pnpm = "12"

[deps.npm]
auto = true

[tasks."build"]
description = "Build"
run = [{ tasks = ["build:cjs", "build:esm", "compile"] }]

[tasks."build:cjs"]
description = "Build CJS only"
run = "pnpm tsc -p tsconfig.cjs.json"

[tasks."build:esm"]
description = "Build ESM only"
run = "pnpm tsc -p tsconfig.esm.json"

[tasks.compile]
description = "Run TypeScript type checking"
run = [{ task = "build:esm", args = ["--declaration", "--emitDeclarationOnly", "--outDir", "./dist"]}]

[tasks.publish]
description = "Publish the package"
depends = ["build"]
run = "pnpm publish --access public"

[tasks."test:unit"]
description = "Run unit tests (watch)"
run = "pnpm vitest"
